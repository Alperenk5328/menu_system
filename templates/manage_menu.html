<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menüyü Yönet</title>
</head>
<body>
    <h1>Menüyü Yönet</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Ad</th>
                <th>Fiyat</th>
                <th>İşlem</th>
            </tr>
        </thead>
        <tbody>
            {% for item in menu_items %}
            <tr>
                <td>{{ item.id }}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.price }}</td>
                <td>
                    <a href="{{ url_for('delete_menu_item', item_id=item.id) }}">Sil</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <h2>Yeni Menü Öğesi Ekle</h2>
    <form action="{{ url_for('add_menu_item') }}" method="post">
        <input type="text" name="name" placeholder="Ürün Adı" required>
        <input type="number" step="0.01" name="price" placeholder="Fiyat" required>
        <button type="submit">Ekle</button>
    </form>
</body>
</html>
